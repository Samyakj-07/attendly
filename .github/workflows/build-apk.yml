name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger with 1-click "Run workflow" button in GitHub Actions tab

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError' -Dorg.gradle.vfs.watch=false"
      _JAVA_OPTIONS: "-Xmx4096m -XX:MaxMetaspaceSize=1536m"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔍 TypeScript Type Check
        run: npm run ts:check

      - name: 🧪 Run Automated Test Suite
        run: npm test

      - name: 🏗️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: ⚙️ Optimize Gradle & Memory Config
        working-directory: android
        run: |
          # Increase Gradle & Kotlin Daemon Metaspace to prevent memory exhaustion
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "android.enableLintVital=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties

      - name: 🔑 Configure Release Signing
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'attendly-key' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Use provided secrets or generate random ephemeral signing credentials
          KS_PASS="${KEYSTORE_PASSWORD:-$(openssl rand -hex 16)}"
          K_PASS="${KEY_PASSWORD:-$KS_PASS}"
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding persistent release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          elif [ ! -f "app/release.keystore" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found. Generating ephemeral CI build keystore. Note: App updates will require uninstalling previous builds unless persistent secrets are configured."
            keytool -genkey -v -keystore app/release.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$K_PASS" -dname "CN=Attendly, OU=Engineering, O=Attendly, L=Delhi, S=Delhi, C=IN"
          fi
          
          # Inject release signing config into android/app/build.gradle
          sed -i "s/signingConfigs {/signingConfigs {\n        release {\n            storeFile file(\"release.keystore\")\n            storePassword \"$KS_PASS\"\n            keyAlias \"$KEY_ALIAS\"\n            keyPassword \"$K_PASS\"\n        }/" app/build.gradle
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' app/build.gradle

      - name: ⚡ Build Standalone APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: 📤 Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Attendly-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
